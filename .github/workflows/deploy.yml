name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'play/**', 'sdk/**', 'submissions/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.HOSTING_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate && pnpm run typecheck && pnpm test && pnpm run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - run: node scripts/publish.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

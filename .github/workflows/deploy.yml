name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'play/**', 'sdk/**', 'submissions/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.HOSTING_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate && pnpm run typecheck && pnpm test && pnpm run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - run: node scripts/publish.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

name: Publish authorized fork preview
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number (current head must pass CI)
        required: true
        type: string
permissions: {}
concurrency:
  group: preview-${{ inputs.pr }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.HOSTING_ENABLED == 'true'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Verify PR scope and artifact provenance
        id: source
        run: node .github/scripts/prepare-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
      - name: Build trusted gallery without auth
        run: node scripts/build-site.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: downloaded
          merge-multiple: true
      - name: Validate static artifact and select only this entry
        run: node .github/scripts/validate-artifact.ts
      - name: Publish static preview
        id: publish
        run: node scripts/publish.ts
        env:
          PREVIEW_PR: ${{ inputs.pr }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      - name: Post preview link
        run: node .github/scripts/comment-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}

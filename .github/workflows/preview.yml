name: Publish authorized fork preview
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number (current head must pass CI)
        required: true
        type: string
permissions: {}
concurrency:
  group: preview-${{ inputs.pr }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.HOSTING_ENABLED == 'true'
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Verify PR scope and artifact provenance
        id: source
        run: node .github/scripts/prepare-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
      - name: Build trusted gallery without auth
        run: node scripts/build-site.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: downloaded
          merge-multiple: true
      - name: Validate static artifact and select only this entry
        run: node .github/scripts/validate-artifact.ts
      - name: Publish static preview
        id: publish
        run: node scripts/publish.ts
        env:
          PREVIEW_PR: ${{ inputs.pr }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      - name: Post preview link
        run: node .github/scripts/comment-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}

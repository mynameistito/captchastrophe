name: Refresh pre-review metadata
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.HOSTING_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/pre-review-index.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/build-site.ts --pre-review .preview/open.json
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - run: node scripts/publish.ts --site-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

name: Refresh pre-review metadata
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.HOSTING_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/pre-review-index.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/build-site.ts --pre-review .preview/open.json
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - run: node scripts/publish.ts --site-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock viewer</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/mock.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--muted); font: 400 14px/20px var(--font); color: var(--foreground); -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--ring); outline-offset: 2px; }
  .bar { display: flex; align-items: center; gap: 24px; padding: 4px 16px; min-height: 56px; background: var(--background); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .grp { display: flex; align-items: center; gap: 2px; flex: none; }
  .lbl { margin-right: 8px; color: var(--muted-foreground); }
  .seg { min-height: 40px; min-width: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-control); background: none; color: var(--muted-foreground); white-space: nowrap; }
  .seg:hover { color: var(--strong); }
  .seg[aria-pressed=true] { background: var(--muted); border-color: var(--border); color: var(--strong); }
  .sp { margin-left: auto; }
  .open { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: var(--radius-control); color: var(--muted-foreground); text-decoration: none; white-space: nowrap; }
  .open:hover { color: var(--strong); background: var(--muted); }
  .canvas { flex: 1; min-height: 0; display: grid; place-items: stretch center; padding: 16px; }
  .frame { width: 100%; max-width: var(--w, 100%); border: 1px solid var(--border); border-radius: var(--radius-panel); overflow: hidden; background: var(--background); transition: max-width var(--panel-duration) var(--ease); }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--background); }
  kbd { font: 12px var(--mono); padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted-foreground); }
  .keys { flex: none; white-space: nowrap; }
  .keys kbd { margin-right: 2px; }
  @media (max-width: 1600px) { .keys { display: none; } }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Mock viewer">
  <div class="grp" role="group" aria-label="Mock" data-key="m"><span class="lbl">Mock</span>
    <button class="seg" type="button" data-v="a">A Ledger</button>
    <button class="seg" type="button" data-v="b">B Rail</button>
    <button class="seg" type="button" data-v="c">C Frame</button></div>
  <div class="grp" role="group" aria-label="Page" data-key="p"><span class="lbl">Page</span>
    <button class="seg" type="button" data-v="home">Library</button>
    <button class="seg" type="button" data-v="entry">Entry</button>
    <button class="seg" type="button" data-v="pre">Pre-review</button></div>
  <div class="grp" role="group" aria-label="Theme" data-key="t"><span class="lbl">Theme</span>
    <button class="seg" type="button" data-v="light">Light</button>
    <button class="seg" type="button" data-v="dark">Dark</button></div>
  <div class="grp" role="group" aria-label="Width" data-key="w"><span class="lbl">Width</span>
    <button class="seg" type="button" data-v="full">Full</button>
    <button class="seg" type="button" data-v="tablet">768</button>
    <button class="seg" type="button" data-v="mobile">390</button></div>
  <span class="sp keys small mute">Keys: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mock, <kbd>[</kbd><kbd>]</kbd> page, <kbd>t</kbd> theme</span>
  <a class="open" id="open" target="_blank" rel="noopener">Open in tab</a>
</div>
<div class="canvas"><div class="frame" id="frame"></div></div>

<script>
  const FILES = { a: 'a-ledger.html', b: 'b-rail.html', c: 'c-frame.html' };
  const WIDTHS = { full: '100%', tablet: '768px', mobile: '390px' };
  const OPTIONS = { m: ['a', 'b', 'c'], p: ['home', 'entry', 'pre'], t: ['light', 'dark'], w: ['full', 'tablet', 'mobile'] };
  const DEFAULTS = { m: 'a', p: 'home', t: 'light', w: 'full' };
  const state = { ...DEFAULTS };
  new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (OPTIONS[k]?.includes(v)) state[k] = v; });

  function mockUrl() {
    const { m, p, t } = state;
    const file = FILES[m], id = p === 'pre' ? 'p1' : 'a1', theme = `theme=${t}`;
    if (m === 'b') return `${file}?${theme}${p === 'home' ? '' : '&sel=' + id}`;
    return `${file}?${theme}${p === 'home' ? '' : '#/e/' + id}`;
  }

  function render() {
    document.documentElement.dataset.theme = state.t;
    document.querySelectorAll('[data-key]').forEach(g => g.querySelectorAll('.seg').forEach(b => b.setAttribute('aria-pressed', String(state[g.dataset.key] === b.dataset.v))));
    const frame = document.getElementById('frame');
    frame.style.setProperty('--w', WIDTHS[state.w]);
    const url = mockUrl();
    const open = document.getElementById('open');
    open.href = url;
    history.replaceState(null, '', '#' + new URLSearchParams(state));
    // Fresh iframe each time so query/hash changes always take effect.
    const f = document.createElement('iframe');
    f.title = 'Mock preview'; f.src = url;
    frame.replaceChildren(f);
  }

  const set = (k, v) => { if (state[k] === v) return; state[k] = v; render(); };
  document.querySelectorAll('[data-key]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('.seg'); if (b) set(g.dataset.key, b.dataset.v); }));
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
    if ('123'.includes(e.key) && e.key) set('m', OPTIONS.m[+e.key - 1]);
    else if (e.key === '[' || e.key === ']') { const o = OPTIONS.p, i = o.indexOf(state.p) + (e.key === ']' ? 1 : -1); set('p', o[(i + o.length) % o.length]); }
    else if (e.key === 't') set('t', state.t === 'dark' ? 'light' : 'dark');
  });
  render();
</script>
</body>
</html>
